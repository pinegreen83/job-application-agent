name: Development setup and native checks

on:
  pull_request:
    branches: [main, 'feat/**']

permissions:
  contents: read

concurrency:
  group: m0-a-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    name: Verify (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.22.3'
          cache: npm
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: '1.100.0'
          components: rustfmt, clippy
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            backend/target
          key: native-backend-${{ runner.os }}-${{ runner.arch }}-rust-1.100.0-${{ hashFiles('backend/Cargo.lock') }}
      - name: Tool versions
        run: |
          node --version
          npm --version
          rustc --version --verbose
          cargo --version
      - name: Common setup, build, and browser integration
        run: npm run setup -- --tests
      - name: Rust format
        run: cargo fmt --manifest-path backend/Cargo.toml -- --check
      - name: Rust check
        run: cargo check --manifest-path backend/Cargo.toml --locked
      - name: Rust lint
        run: cargo clippy --manifest-path backend/Cargo.toml --locked --all-targets -- -D warnings
      - name: Rust tests
        run: cargo test --manifest-path backend/Cargo.toml --locked
      - name: Tauri debug build without installers
        run: npm run tauri build -- --debug --no-bundle --ci -- --locked
      - name: Lockfiles remain unchanged
        run: git diff --exit-code -- package-lock.json backend/Cargo.lock
