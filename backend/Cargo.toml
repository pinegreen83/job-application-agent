[package]
name = "job-application-agent"
version = "0.0.0"
description = "Job Application Agent development shell"
edition = "2021"
publish = false

[lib]
name = "job_application_agent_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
rusqlite = { version = "=0.43.0", default-features = false, features = ["bundled"] }
tokio = { version = "=1.54.1", default-features = false, features = ["sync"] }
uuid = { version = "=1.29.3", features = ["v4"] }

[dev-dependencies]
tauri = { version = "=2.12.6", features = ["test"] }
tempfile = "=3.27.0"
